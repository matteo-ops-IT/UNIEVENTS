<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F1;
    --ink:#1B1B1D;
    --red:#D6272B;
    --line:#E3DFD6;
    --muted:#78726A;
    --tape:#EFE6C8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    margin-bottom:22px;
  }
  .logo{
    font-family:'Archivo Black',sans-serif;
    font-size:30px;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .logo span{color:var(--red);}
  .tagline{
    margin-top:8px;
    color:var(--muted);
    font-size:15px;
  }

  .tabs{
    display:flex;
    gap:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .tab{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    padding:0 0 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{
    color:var(--ink);
    border-bottom-color:var(--red);
  }

  /* Bottone separato, non un tab: apre/chiude la sezione degli eventi passati */
  .past-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
  }
  .past-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
  }
  .past-btn:hover{
    border-color:var(--muted);
    color:var(--ink);
  }
  .past-btn.active-past{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .card{
    position:relative;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 18px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .card::before{
    content:"";
    position:absolute;
    top:-8px;
    left:22px;
    width:34px;
    height:16px;
    background:var(--tape);
    opacity:0.9;
    transform:rotate(-3deg);
  }
  .card.next{
    border-color:var(--red);
  }
  .card.next::before{
    background:var(--red);
    opacity:0.85;
  }
  .card.past{
    opacity:0.55;
  }
  .card.past::before{
    background:var(--line);
  }
  .card:nth-child(3n+1){ transform:rotate(-0.6deg); }
  .card:nth-child(3n+2){ transform:rotate(0.5deg); }
  .card:nth-child(3n)  { transform:rotate(-0.2deg); }

  .card-meta{
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .card.next .card-meta{
    color:var(--red);
    font-weight:600;
  }
  .card-title{
    font-size:18px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:8px;
  }
  .card-place{
    font-size:14px;
    color:var(--muted);
  }

  .empty{
    padding:30px 18px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:3px;
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
  }
  .empty button{
    margin-top:12px;
    background:none;
    border:none;
    color:var(--red);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    text-decoration:underline;
  }

  .cta{
    margin-top:32px;
    padding:20px;
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
  }
  .cta p{
    margin:0 0 12px;
    font-size:15px;
  }
  .cta a{
    display:inline-block;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    padding:10px 16px;
    border-radius:3px;
  }

  footer{
    margin-top:30px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Uni<span>Events</span></div>
      <div class="tagline">Quello che succede all'Unical, prima che finisca.</div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="oggi">Oggi</button>
      <button class="tab" data-tab="settimana">Questa settimana</button>
      <button class="tab" data-tab="mese">Questo mese</button>
    </nav>

    <div class="past-row">
      <button class="past-btn" id="past-btn">Cosa mi sono perso</button>
    </div>

    <div class="list" id="list"></div>

    <div class="cta">
      <p>Conosci un evento che manca?</p>
      <a href="#" id="segnala-link">Segnalalo in 30 secondi</a>
    </div>

    <footer>
      Uni Events è un progetto studentesco indipendente, non affiliato ufficialmente all'Ateneo. Le fonti degli eventi sono sempre linkate.
    </footer>
  </div>

<script>
  // ==================================================================
  // CONFIGURAZIONE SUPABASE
  // Sostituisci questi due valori con quelli del tuo progetto Supabase:
  // Project Settings → API → Project URL / anon public key
  // ==================================================================
  const SUPABASE_URL = "https://ttnwhqpvwkihszxpbdbe.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_W4TDBUcZsTSKPe6fdt0HhQ_6t8KyjXO";

  // Eventi di riserva, usati SOLO se il fetch a Supabase fallisce
  // (es. mentre stai ancora configurando il database).
  const fallbackEvents = [
    { title: "Punto Informazioni Matricole", place: "Piazzale delle Aule", date: "2026-09-08T09:00:00", link: "#" },
    { title: "Passeggiata delle Matricole", place: "Campus di Arcavacata", date: "2026-09-11T10:00:00", link: "#" },
    { title: "Welcome Day — Presentazione Corsi", place: "Aula Magna", date: "2026-09-12T09:30:00", link: "#" },
  ];

  let events = [];

  async function fetchEvents() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/events?select=*&order=event_date.asc`,
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      if (!res.ok) throw new Error("Risposta non valida da Supabase");
      const data = await res.json();
      return data.map(e => ({
        title: e.title,
        place: e.place,
        date: e.event_date,
        link: e.link,
      }));
    } catch (err) {
      console.warn("Fetch Supabase fallito, uso eventi di riserva:", err);
      return fallbackEvents;
    }
  }

  function getBuckets() {
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const endToday = new Date(startToday); endToday.setDate(startToday.getDate() + 1);
    const endWeek = new Date(startToday); endWeek.setDate(startToday.getDate() + 7);
    const endMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const startWeekAgo = new Date(startToday); startWeekAgo.setDate(startToday.getDate() - 7);

    return {
      oggi: events.filter(e => e.dateObj >= startToday && e.dateObj < endToday),
      settimana: events.filter(e => e.dateObj >= startToday && e.dateObj < endWeek),
      mese: events.filter(e => e.dateObj >= startToday && e.dateObj < endMonth),
      passati: events
        .filter(e => e.dateObj >= startWeekAgo && e.dateObj < startToday)
        .sort((a, b) => b.dateObj - a.dateObj), // più recenti prima
    };
  }

  function formatDate(d) {
    const s = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
    const t = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    return `${s} · ${t}`;
  }

  const emptyMessages = {
    oggi: { text: "Nessun evento in programma per oggi.", jump: "settimana", cta: "Guarda questa settimana" },
    settimana: { text: "Nessun evento in programma questa settimana.", jump: "mese", cta: "Guarda questo mese" },
    mese: { text: "Nessun evento ancora segnalato per questo mese.", jump: null, cta: null },
    passati: { text: "Nessun evento negli ultimi 7 giorni.", jump: null, cta: null },
  };

  function render(tab) {
    document.querySelectorAll('.tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    const buckets = getBuckets();
    const list = buckets[tab];
    const container = document.getElementById('list');
    container.innerHTML = '';

    if (list.length === 0) {
      const info = emptyMessages[tab];
      const div = document.createElement('div');
      div.className = 'empty';
      div.innerHTML = `<div>${info.text}</div>` +
        (info.jump ? `<button data-jump="${info.jump}">${info.cta}</button>` : '');
      container.appendChild(div);
      const jumpBtn = div.querySelector('button');
      if (jumpBtn) jumpBtn.addEventListener('click', () => render(info.jump));
      return;
    }

    const isPastTab = tab === 'passati';

    list.forEach((e, i) => {
      const card = document.createElement('div');
      const highlight = !isPastTab && i === 0;
      card.className = 'card' + (highlight ? ' next' : '') + (isPastTab ? ' past' : '');
      card.innerHTML = `
        <div class="card-meta">${highlight ? 'Il prossimo · ' : ''}${formatDate(e.dateObj)}</div>
        <div class="card-title">${e.title}</div>
        <div class="card-place">📍 ${e.place}</div>
      `;
      container.appendChild(card);
    });
  }

  const pastBtn = document.getElementById('past-btn');
  const tabsNav = document.getElementById('tabs');
  let inPastView = false;

  function exitPastView() {
    inPastView = false;
    tabsNav.style.display = 'flex';
    pastBtn.textContent = 'Cosa mi sono perso';
    pastBtn.classList.remove('active-past');
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      if (inPastView) exitPastView();
      render(btn.dataset.tab);
    });
  });

  pastBtn.addEventListener('click', () => {
    if (inPastView) {
      exitPastView();
      render('oggi');
      return;
    }
    inPastView = true;
    tabsNav.style.display = 'none';
    pastBtn.textContent = '← Torna agli eventi';
    pastBtn.classList.add('active-past');
    render('passati');
  });

  document.getElementById('segnala-link').href = "https://forms.gle/357kSGUfBum8gNg58";

  async function init() {
    const container = document.getElementById('list');
    container.innerHTML = '<div class="empty">Carico gli eventi…</div>';

    const rawEvents = await fetchEvents();
    events = rawEvents
      .map(e => ({ ...e, dateObj: new Date(e.date) }))
      .sort((a, b) => a.dateObj - b.dateObj);

    render('oggi');
  }

  init();
</script>
</body>
</html>
