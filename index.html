<html lang="it">
<head>

<meta property="og:url" content="https://TUO-DOMINIO/">

<style>
  :root{
    --paper:#F7F5F1;
    --ink:#1B1B1D;
    --red:#D6272B;
    --line:#E3DFD6;
    --muted:#78726A;
    --tape:#EFE6C8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  /* ===== Logo discreto, sempre in alto a sinistra ===== */
  .brand-logo{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top,0px));
    left:16px;
    z-index:150;
    opacity:0.92;
  }
  .brand-logo img{
    display:block;
    height:19px;
    width:auto;
  }

  /* ===== Menu ☰ in alto a destra ===== */
  .menu-btn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    right:14px;
    z-index:150;
    background:rgba(247,245,241,0.85);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    color:var(--ink);
    width:36px;
    height:36px;
    border-radius:100px;
    font-size:16px;
    cursor:pointer;
  }
  .menu-panel{
    position:fixed;
    top:calc(52px + env(safe-area-inset-top,0px));
    right:14px;
    z-index:150;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,0.16);
    padding:6px;
    min-width:220px;
    display:none;
    flex-direction:column;
  }
  .menu-panel.open{ display:flex; }
  .menu-panel button, .menu-panel a{
    background:none;
    border:none;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    padding:11px 12px;
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    display:block;
  }
  .menu-panel button:hover, .menu-panel a:hover{ background:var(--paper); }
  .menu-panel button.active{ color:var(--red); }
  .menu-sep{ height:1px; background:var(--line); margin:5px 8px; }

  /* ===== Il feed: uno schermo intero per evento, si scorre e basta ===== */
  .feed{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  .feed-slide{
    min-height:100vh;
    min-height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    padding:0 18px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .feed-meta-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
    padding-top:calc(48px + env(safe-area-inset-top,0px));
    padding-bottom:10px;
  }
  .feed-badge{
    margin-right:auto;
    background:var(--red);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:6px 12px;
    border-radius:100px;
    white-space:nowrap;
  }
  .feed-slide.is-live .feed-badge{
    background:#fff;
    color:var(--red);
    border:1.5px solid var(--red);
  }

  .feed-poster-wrap{
    flex:1;
    min-height:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 0;
  }
  .feed-poster-wrap::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:40px;
    height:16px;
    background:var(--tape);
    opacity:0.9;
    z-index:2;
  }
  .feed-slide:nth-child(3n+2) .feed-poster-wrap::before{ transform:translateX(-50%) rotate(2deg); }
  .feed-slide:nth-child(3n) .feed-poster-wrap::before{ transform:translateX(-50%) rotate(-1deg); }
  .feed-poster{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,0.12);
    border-radius:2px;
  }
  .feed-slide:nth-child(3n+1) .feed-poster{ transform:rotate(-1deg); }
  .feed-slide:nth-child(3n+2) .feed-poster{ transform:rotate(0.8deg); }
  .feed-poster-empty{
    width:100%;
    height:100%;
    border:1px dashed var(--line);
    border-radius:3px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-family:'Archivo Black',sans-serif;
    font-size:15px;
    line-height:1.4;
    padding:24px;
  }

  .feed-info{ flex-shrink:0; padding-top:14px; }
  .feed-title{
    font-family:'Archivo Black',sans-serif;
    font-size:21px;
    line-height:1.25;
    margin-bottom:5px;
  }
  .feed-place{ font-size:14px; color:var(--muted); margin-bottom:9px; }
  .feed-reason{ font-size:13.5px; line-height:1.5; margin-bottom:13px; }
  .feed-reason b{ color:var(--red); }
  .feed-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .remind-btn{
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .remind-btn.active{ background:var(--red); border-color:var(--red); color:#fff; }
  .share-btn{
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px;
    width:36px;
    height:36px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .share-btn svg{ width:16px; height:16px; display:block; }
  .source-pill{
    margin-left:auto;
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 13px;
    white-space:nowrap;
  }
  .source-pill:hover{ border-color:var(--muted); color:var(--ink); }

  .feed-hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    animation:bob 1.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes bob{
    0%,100%{ transform:translate(-50%,0); }
    50%{ transform:translate(-50%,-6px); }
  }

  .feed-slide.shared-highlight .feed-poster,
  .feed-slide.shared-highlight .feed-poster-empty{
    animation: pulse-shared 1.1s ease-in-out 2;
  }
  @keyframes pulse-shared{
    0%{ box-shadow:0 0 0 0 rgba(214,39,43,0.45); }
    60%{ box-shadow:0 0 0 12px rgba(214,39,43,0); }
    100%{ box-shadow:0 0 0 0 rgba(214,39,43,0); }
  }

  /* ===== Ultima card: chiusura del feed con CTA e nota ===== */
  .feed-end{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding-top:calc(48px + env(safe-area-inset-top,0px));
  }
  .feed-end .end-title{
    font-family:'Archivo Black',sans-serif;
    font-size:22px;
    max-width:280px;
  }
  .feed-end .cta{
    padding:20px;
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
    max-width:320px;
  }
  .feed-end .cta p{ margin:0 0 12px; font-size:15px; }
  .feed-end .cta a{
    display:inline-block;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    padding:10px 16px;
    border-radius:3px;
  }
  .feed-end footer{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
    max-width:300px;
  }

  .toast{
    position:fixed;
    left:16px;
    right:16px;
    top:calc(16px + env(safe-area-inset-top,0px));
    max-width:528px;
    margin:0 auto;
    background:var(--ink);
    color:var(--paper);
    padding:13px 16px;
    border-radius:8px;
    font-size:13.5px;
    line-height:1.45;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transform:translateY(-8px);
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:200;
  }
  .toast.visible{ opacity:1; transform:translateY(0); }

  .install-banner{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--ink);
    color:var(--paper);
    padding:20px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -10px 30px rgba(0,0,0,0.3);
    display:none;
    align-items:center;
    gap:14px;
    z-index:160;
    border-top:3px solid var(--red);
  }
  .install-banner.visible{ display:flex; }
  .install-banner-text{ flex:1; font-size:15px; line-height:1.5; }
  .install-banner-text strong{ display:block; font-size:17px; margin-bottom:3px; }
  .install-banner button{
    background:var(--red);
    color:#fff;
    border:none;
    font-weight:700;
    font-size:15px;
    padding:13px 18px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
</style>

<body>

  <div class="brand-logo"><img src="logo-wordmark.png" alt="Uni Events"></div>

  <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
  <div class="menu-panel" id="menu-panel">
    <button id="menu-notif">🔔 Avvisami!</button>
    <div class="menu-sep"></div>
    <button id="menu-today">📅 Vai a oggi</button>
    <button id="menu-past">🕰️ Cosa mi sono perso</button>
    <div class="menu-sep"></div>
    <a id="menu-segnala" href="#" target="_blank" rel="noopener noreferrer">📝 Segnala un evento</a>
  </div>

  <div class="feed" id="feed"></div>

  <div class="toast" id="toast"></div>

  <div class="install-banner" id="install-banner">
    <div class="install-banner-text" id="install-banner-text">
      <strong>Installa Uni Events</strong>
      Aggiungilo alla schermata Home per aprirlo come un'app.
    </div>
    <button id="install-banner-action">Installa</button>
  </div>

<script>
  // ==================================================================
  // CONFIGURAZIONE SUPABASE
  // ==================================================================
  const SUPABASE_URL = "https://ttnwhqpvwkihszxpbdbe.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_W4TDBUcZsTSKPe6fdt0HhQ_6t8KyjXO";
  const VAPID_PUBLIC_KEY = "BBgvdvS4RK60mNFi0zBvwxfTSAVUOX9tm-4rSxHzBXuMrrnSRYhGbQFwS3Po4KJeVfyco2gO_Lp5opW95S2N7sQ";

  const fallbackEvents = [
    { title: "Punto Informazioni Matricole", place: "Piazzale delle Aule", date: "2026-09-08T09:00:00", link: "#" },
    { title: "Passeggiata delle Matricole", place: "Campus di Arcavacata", date: "2026-09-11T10:00:00", link: "#" },
    { title: "Welcome Day — Presentazione Corsi", place: "Aula Magna", date: "2026-09-12T09:30:00", link: "#" },
  ];

  let events = [];

  function track(name, data) {
    try { window.umami && window.umami.track(name, data); } catch (err) {}
  }

  // sub_events: una riga per appuntamento, "Titolo | Luogo | 20:30 | Descrizione"
  function parseSubEvents(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) return raw;
    const text = String(raw).trim();
    if (!text) return [];
    if (text.startsWith('[')) {
      try { return JSON.parse(text); } catch (err) { console.warn('sub_events non valido:', err); }
    }
    return text.split('\n')
      .map(line => line.trim())
      .filter(line => line)
      .map(line => {
        const parts = line.split('|').map(x => x.trim());
        return { title: parts[0], place: parts[1], time: parts[2], description: parts.slice(3).join(' | ') };
      });
  }

  async function fetchEvents() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/events?select=*&order=event_date.asc`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      if (!res.ok) throw new Error("Risposta non valida da Supabase");
      const data = await res.json();
      return data.map(e => ({
        id: e.id,
        title: e.title,
        place: e.place,
        date: e.event_date,
        end: e.event_end || null,
        link: e.link,
        image_url: e.image_url,
        description: e.description,
        sub_events: parseSubEvents(e.sub_events),
      }));
    } catch (err) {
      console.warn("Fetch Supabase fallito, uso eventi di riserva:", err);
      return fallbackEvents;
    }
  }

  const MONTHS_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  function monthLabel(dateObj) {
    const m = MONTHS_IT[dateObj.getMonth()];
    return m.charAt(0).toUpperCase() + m.slice(1);
  }

  function formatDate(e) {
    const s = e.dateObj.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
    const startT = e.dateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    if (e.endDateObj) {
      const endT = e.endDateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      return `${s} · ${startT}–${endT}`;
    }
    return `${s} · ${startT}`;
  }

  function feedDateLabel(e, now) {
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startTarget = new Date(e.dateObj.getFullYear(), e.dateObj.getMonth(), e.dateObj.getDate());
    const diffDays = Math.round((startTarget - startToday) / 86400000);
    let d;
    if (diffDays === 0) d = 'Oggi';
    else if (diffDays === 1) d = 'Domani';
    else if (diffDays === -1) d = 'Ieri';
    else {
      const wd = e.dateObj.toLocaleDateString('it-IT', { weekday: 'long' });
      d = `${wd.charAt(0).toUpperCase()}${wd.slice(1)} ${e.dateObj.getDate()} ${monthLabel(e.dateObj).toLowerCase()}`;
    }
    const t = e.dateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    return `${d} · ${t}`;
  }

  const FEED_REASONS = [
    "Un modo diverso per staccare dalla solita routine di lezioni.",
    "Occasione buona per conoscere gente nuova nel campus.",
    "Vale un salto, anche solo per curiosità: dura poco.",
    "Di quegli eventi di cui poi si parla il giorno dopo.",
    "Piccolo impegno, possibile bel ricordo da raccontare.",
    "Un'ora diversa dal solito, giusto per cambiare aria.",
  ];
  function feedReason(e) {
    if (e.description) {
      const plain = e.description.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      if (plain) return plain.length > 170 ? plain.slice(0, 167) + '…' : plain;
    }
    const sum = String(e.id).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    return FEED_REASONS[sum % FEED_REASONS.length];
  }

  function eventCutoff(e) { return e.endDateObj || e.dateObj; }
  function isLive(e, now) { return !!e.endDateObj && now >= e.dateObj && now <= e.endDateObj; }
  function getNextEvent(now) { return events.find(e => e.dateObj > now) || null; }

  const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>`;

  // ==================================================================
  // IL FEED — un'unica lista continua: eventi recenti passati (7 giorni)
  // + oggi + tutti i futuri, in ordine cronologico. Si scorre e basta.
  // ==================================================================
  let feedList = [];
  const feedEl = document.getElementById('feed');

  function buildFeedList() {
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startWeekAgo = new Date(startToday); startWeekAgo.setDate(startToday.getDate() - 7);
    return events.filter(e => eventCutoff(e) >= startWeekAgo); // events è già ordinato per data crescente
  }

  function renderFeedSlide(e, now, nextEvent) {
    const isReminded = !!localStorage.getItem('ue_reminded_' + e.id);
    const live = isLive(e, now);
    const isNext = nextEvent && e.id === nextEvent.id;
    const hasSource = !!(e.link && e.link !== '#');
    const subs = e.sub_events || [];

    const slide = document.createElement('div');
    slide.className = 'feed-slide' + (live ? ' is-live' : '');
    slide.dataset.eventId = e.id;

    const subsHtml = subs.length ? `<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">+ ${subs.length} appuntamenti nel programma</div>` : '';

    slide.innerHTML = `
      <div class="feed-meta-row">
        <div class="feed-badge">${live ? '🔴 LIVE ORA · ' : (isNext ? 'Il prossimo · ' : '')}${feedDateLabel(e, now)}</div>
        ${hasSource ? `<a class="source-pill" href="${e.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation(); track('click_fonte', {evento: '${e.title.replace(/'/g, "\\'")}'})">🔗 Fonte</a>` : ''}
      </div>
      <div class="feed-poster-wrap">
        ${e.image_url
          ? `<img class="feed-poster" src="${e.image_url}" alt="Locandina evento" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'feed-poster-empty\\'>🎉<br>${e.title.replace(/'/g, "\\'")}</div>'">`
          : `<div class="feed-poster-empty">🎉<br>${e.title}</div>`}
      </div>
      <div class="feed-info">
        <div class="feed-title">${e.title}</div>
        <div class="feed-place">📍 ${e.place}${subsHtml}</div>
        <div class="feed-reason"><b>Perché andarci</b> — ${feedReason(e)}</div>
        <div class="feed-actions">
          <button class="remind-btn${isReminded ? ' active' : ''}" data-event-id="${e.id}">${isReminded ? '🔔 Promemoria attivo' : '🔔 Ricordamelo'}</button>
          <button class="share-btn" data-event-id="${e.id}" title="Condividi evento" aria-label="Condividi evento">${SHARE_ICON}</button>
        </div>
      </div>
    `;

    slide.querySelector('.remind-btn').addEventListener('click', () => {
      const btn = slide.querySelector('.remind-btn');
      track(btn.classList.contains('active') ? 'rimuovi_ricordamelo' : 'click_ricordamelo', { evento: e.title });
      remindMe(e.id, btn);
    });
    slide.querySelector('.share-btn').addEventListener('click', () => {
      track('click_condividi', { evento: e.title });
      shareEvent(e);
    });

    return slide;
  }

  function buildEndSlide() {
    const div = document.createElement('div');
    div.className = 'feed-slide feed-end';
    div.innerHTML = `
      <div class="end-title">Per ora è tutto 👋</div>
      <div class="cta">
        <p>Conosci un evento che manca?</p>
        <a href="https://forms.gle/357kSGUfBum8gNg58" target="_blank" rel="noopener noreferrer">Segnalalo in 30 secondi</a>
      </div>
      <footer>Uni Events è un progetto studentesco indipendente, non affiliato ufficialmente all'Ateneo. Le fonti degli eventi sono sempre linkate.</footer>
    `;
    return div;
  }

  // Tiene traccia di quale evento è attualmente a schermo (serve per il
  // pull-to-refresh: dopo l'aggiornamento si torna dove si era rimasti)
  let currentVisibleId = null;
  let feedObserver = null;

  function renderFeed(startId) {
    feedList = buildFeedList();
    feedEl.innerHTML = '';

    if (!feedList.length) {
      feedEl.innerHTML = '<div class="feed-slide" style="align-items:center;justify-content:center;text-align:center;color:var(--muted)">Nessun evento al momento.</div>';
      return;
    }

    const now = new Date();
    const nextEvent = getNextEvent(now);
    feedList.forEach(e => feedEl.appendChild(renderFeedSlide(e, now, nextEvent)));
    feedEl.appendChild(buildEndSlide());

    // Suggerimento "scorri" solo sulla primissima card
    const firstSlide = feedEl.firstElementChild;
    if (firstSlide && feedList.length > 1) {
      firstSlide.style.position = 'relative';
      const hint = document.createElement('div');
      hint.className = 'feed-hint';
      hint.id = 'feed-hint';
      hint.innerHTML = '⌄<br>Scorri per il prossimo';
      firstSlide.appendChild(hint);
    }

    let startIndex = 0;
    if (startId != null) {
      const idx = feedList.findIndex(e => String(e.id) === String(startId));
      if (idx >= 0) startIndex = idx;
    } else {
      const idx = feedList.findIndex(e => eventCutoff(e) >= now);
      startIndex = idx >= 0 ? idx : feedList.length - 1;
    }
    requestAnimationFrame(() => {
      feedEl.scrollTop = startIndex * feedEl.clientHeight;
      if (startId != null) {
        const target = feedEl.children[startIndex];
        if (target) {
          target.classList.add('shared-highlight');
          setTimeout(() => target.classList.remove('shared-highlight'), 2400);
        }
      }
    });

    if (feedObserver) feedObserver.disconnect();
    feedObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
          const hintEl = document.getElementById('feed-hint');
          if (hintEl) hintEl.remove();
          if (entry.target.dataset.eventId) currentVisibleId = entry.target.dataset.eventId;
        }
      });
    }, { root: feedEl, threshold: [0.6] });
    Array.from(feedEl.children).forEach(slide => feedObserver.observe(slide));
  }

  function scrollToFeedIndex(idx) {
    const target = feedEl.children[idx];
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ==================================================================
  // MENU (☰): avvisami, vai a oggi, cosa mi sono perso, segnala evento
  // ==================================================================
  const menuBtn = document.getElementById('menu-btn');
  const menuPanel = document.getElementById('menu-panel');
  menuBtn.addEventListener('click', (evt) => { evt.stopPropagation(); menuPanel.classList.toggle('open'); });
  document.addEventListener('click', (evt) => {
    if (menuPanel.classList.contains('open') && !menuPanel.contains(evt.target) && evt.target !== menuBtn) {
      menuPanel.classList.remove('open');
    }
  });

  document.getElementById('menu-today').addEventListener('click', () => {
    track('menu_vai_a_oggi');
    const now = new Date();
    const idx = feedList.findIndex(e => eventCutoff(e) >= now);
    if (idx >= 0) scrollToFeedIndex(idx); else showToast('Nessun evento futuro in programma.');
    menuPanel.classList.remove('open');
  });

  document.getElementById('menu-past').addEventListener('click', () => {
    track('menu_cosa_mi_sono_perso');
    const now = new Date();
    if (feedList.length && eventCutoff(feedList[0]) < now) {
      scrollToFeedIndex(0);
    } else {
      showToast('Nessun evento perso negli ultimi 7 giorni 🎉');
    }
    menuPanel.classList.remove('open');
  });

  document.getElementById('menu-segnala').href = "https://forms.gle/357kSGUfBum8gNg58";

  async function init() {
    feedEl.innerHTML = '<div class="feed-slide" style="align-items:center;justify-content:center;color:var(--muted)">Carico gli eventi…</div>';

    const rawEvents = await fetchEvents();
    events = rawEvents
      .map(e => ({ ...e, dateObj: new Date(e.date), endDateObj: e.end ? new Date(e.end) : null }))
      .sort((a, b) => a.dateObj - b.dateObj);

    const params = new URLSearchParams(window.location.search);
    const sharedId = params.get('event');
    if (sharedId) history.replaceState({}, '', window.location.pathname);

    renderFeed(sharedId || null);

    if (localStorage.getItem('ue_notify_new') === '1' || localStorage.getItem('ue_sub_id')) {
      ensureSubscribed().catch(() => {});
    }
  }

  init();

  // ==================================================================
  // AGGIORNAMENTO: tira giù per ricaricare + ricarica alla riapertura
  // ==================================================================
  let lastRefresh = Date.now();

  async function refreshEvents() {
    lastRefresh = Date.now();
    const raw = await fetchEvents();
    events = raw
      .map(e => ({ ...e, dateObj: new Date(e.date), endDateObj: e.end ? new Date(e.end) : null }))
      .sort((a, b) => a.dateObj - b.dateObj);
    renderFeed(currentVisibleId);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 60000) {
      refreshEvents();
    }
  });

  let pullStartY = 0, pulling = false;
  feedEl.addEventListener('touchstart', (e) => {
    if (feedEl.scrollTop <= 0) { pullStartY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  feedEl.addEventListener('touchend', (e) => {
    if (!pulling) return;
    pulling = false;
    if (e.changedTouches[0].clientY - pullStartY > 90) {
      showToast('🔄 Aggiorno gli eventi…', 1500);
      refreshEvents();
    }
  });

  // ==================================================================
  // PWA: service worker + banner "Aggiungi alla schermata Home"
  // ==================================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Service worker non registrato:', err);
      });
    });
  }

  (function setupInstallBanner() {
    const banner = document.getElementById('install-banner');
    const textEl = document.getElementById('install-banner-text');
    const actionBtn = document.getElementById('install-banner-action');

    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
    if (isStandalone) return;

    const ua = window.navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    function showBanner() { banner.classList.add('visible'); }

    if (isIOS) {
      textEl.innerHTML = `<strong>Installa Uni Events</strong>Tocca l'icona Condividi <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2v13"/><path d="M8 6l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> (in Safari in basso, nei ⋯ in alto su Chrome e altri browser), poi "Aggiungi a Home".`;
      actionBtn.style.display = 'none';
      showBanner();
      return;
    }

    window.addEventListener('appinstalled', () => track('app_installata'));

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showBanner();
    });

    actionBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      track('click_installa_banner');
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove('visible');
    });
  })();

  // ==================================================================
  // NOTIFICHE PUSH
  // ==================================================================
  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  function showToast(message, duration = 4000) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('visible'), duration);
  }

  function pushSupported() {
    return 'serviceWorker' in navigator && 'PushManager' in window;
  }

  async function ensureSubscribed() {
    if (!pushSupported()) {
      alert('Le notifiche non sono supportate su questo browser/dispositivo (su iPhone serve prima installare il sito sulla schermata Home).');
      return null;
    }
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'denied') {
        alert('Hai bloccato le notifiche per questo sito in passato. Per attivarle, vai nelle impostazioni del browser (icona del lucchetto accanto all\'indirizzo) e consenti le notifiche, poi riprova.');
        return null;
      }
      if (permission !== 'granted') return null;

      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const subJson = sub.toJSON();

      const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=representation',
        },
        body: JSON.stringify({ endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth }),
      });
      if (!res.ok) {
        const errText = await res.text();
        console.error('Errore salvataggio sottoscrizione', errText);
        alert('Qualcosa è andato storto nel salvare la tua iscrizione. Dettaglio tecnico: ' + errText);
        return null;
      }
      const rows = await res.json();
      const id = rows[0]?.id;
      if (!id) {
        alert('Iscrizione salvata ma non ho ricevuto un id di conferma. Riprova tra poco.');
        return null;
      }
      localStorage.setItem('ue_sub_id', String(id));
      return id;
    } catch (err) {
      console.error('Errore attivazione notifiche', err);
      alert('Errore durante l\'attivazione delle notifiche: ' + err.message);
      return null;
    }
  }

  (function setupNotifButton() {
    const btn = document.getElementById('menu-notif');
    if (localStorage.getItem('ue_notify_new') === '1') {
      btn.textContent = '🔔 Ti avviso!';
      btn.classList.add('active');
    }
    btn.addEventListener('click', async () => {
      if (localStorage.getItem('ue_notify_new') === '1') {
        track('disattiva_avvisami');
        const subId = localStorage.getItem('ue_sub_id');
        btn.textContent = 'Un attimo...';
        try {
          if (subId) {
            await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?id=eq.${subId}`, {
              method: 'PATCH',
              headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ notify_new_events: false }),
            });
          }
        } catch (err) { console.warn('Errore disattivazione (procedo comunque):', err); }
        localStorage.removeItem('ue_notify_new');
        btn.textContent = '🔔 Avvisami!';
        btn.classList.remove('active');
        return;
      }

      track('click_avvisami');
      const originalText = btn.textContent;
      btn.textContent = 'Un attimo...';
      const id = await ensureSubscribed();
      if (!id) { btn.textContent = originalText; return; }
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?id=eq.${id}`, {
          method: 'PATCH',
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ notify_new_events: true }),
        });
        if (!res.ok) {
          alert('Iscrizione avvenuta ma non sono riuscito ad attivare gli avvisi sui nuovi eventi. Dettaglio: ' + (await res.text()));
          btn.textContent = originalText;
          return;
        }
      } catch (err) {
        alert('Errore di rete durante l\'attivazione: ' + err.message);
        btn.textContent = originalText;
        return;
      }
      localStorage.setItem('ue_notify_new', '1');
      btn.textContent = '🔔 Ti avviso!';
      btn.classList.add('active');
      showToast('🔔 Attivato! Ti avviseremo ogni volta che viene aggiunto un nuovo evento.');
    });
  })();

  async function remindMe(eventId, btnEl) {
    const already = localStorage.getItem('ue_reminded_' + eventId);

    if (already) {
      const subId = localStorage.getItem('ue_sub_id');
      btnEl.textContent = 'Un attimo...';
      try {
        if (subId) {
          await fetch(`${SUPABASE_URL}/rest/v1/event_reminders?event_id=eq.${eventId}&subscription_id=eq.${subId}`, {
            method: 'DELETE',
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
          });
        }
      } catch (err) { console.warn('Errore rimozione promemoria (procedo comunque):', err); }
      localStorage.removeItem('ue_reminded_' + eventId);
      btnEl.textContent = '🔔 Ricordamelo';
      btnEl.classList.remove('active');
      showToast('Promemoria rimosso.');
      return;
    }

    btnEl.textContent = 'Attivo...';
    const id = await ensureSubscribed();
    if (!id) { btnEl.textContent = '🔔 Ricordamelo'; return; }
    let remindRes;
    try {
      remindRes = await fetch(`${SUPABASE_URL}/rest/v1/event_reminders`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=ignore-duplicates',
        },
        body: JSON.stringify({ event_id: eventId, subscription_id: id }),
      });
    } catch (err) {
      alert('Errore di rete durante il salvataggio del promemoria: ' + err.message);
      btnEl.textContent = '🔔 Ricordamelo';
      return;
    }
    if (!remindRes.ok) {
      const errText = await remindRes.text();
      console.error('Errore salvataggio promemoria', errText);
      alert('Non sono riuscito a salvare il promemoria. Dettaglio tecnico: ' + errText);
      btnEl.textContent = '🔔 Ricordamelo';
      return;
    }
    localStorage.setItem('ue_reminded_' + eventId, '1');
    btnEl.textContent = '🔔 Promemoria attivo';
    btnEl.classList.add('active');
    showToast('🔔 Fatto! Ti avviseremo la mattina di questo evento, così non te lo perdi.');
  }

  async function shareEvent(e) {
    const text = `📅 ${e.title}\n📍 ${e.place}\n🗓️ ${formatDate(e)}\n\nScopri di più su Uni Events:`;
    const url = `${window.location.origin}${window.location.pathname}?event=${encodeURIComponent(e.id)}`;

    if (navigator.share) {
      try { await navigator.share({ title: e.title, text, url }); }
      catch (err) { if (err.name !== 'AbortError') console.warn('Errore condivisione:', err); }
      return;
    }
    try {
      await navigator.clipboard.writeText(`${text}\n${url}`);
      showToast('📋 Copiato negli appunti!');
    } catch (err) {
      console.warn('Copia negli appunti fallita:', err);
      alert(`${text}\n${url}`);
    }
  }
</script>
